<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chanlan 缠论分析</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #131722; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .toolbar { height: 52px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #202431; border-bottom: 1px solid #363c4e; overflow-x: auto; }
    .brand { font-weight: 950; color: #f1d28a; white-space: nowrap; letter-spacing: .04em; text-shadow: 0 0 20px rgba(241,210,138,.28); }
    .brand span { color: #4f7dff; }
    .group { display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px; background: #151923; border-radius: 8px; white-space: nowrap; }
    label { font-size: 12px; color: rgba(232,236,246,.78); }
    select, input, button { background: #2a2e39; color: #d1d4dc; border: 1px solid #3a4052; border-radius: 6px; padding: 6px 10px; font-size: 12px; }
    input { width: 116px; }
    button { cursor: pointer; }
    button.primary { background: #2962ff; border-color: #2962ff; color: #fff; font-weight: 800; }
    .spacer { flex: 1 0 auto; }
    .status { color: rgba(232,236,246,.72); font-size: 12px; white-space: nowrap; }
    .status b { color: #19e6a6; }
    .main { display: grid; grid-template-columns: 1fr 300px; height: calc(100vh - 52px); }
    #chart { width: 100%; height: 100%; }
    .sidebar { background: #202431; border-left: 1px solid #363c4e; overflow-y: auto; padding: 12px; }
    .card { border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.035); border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: inset 0 1px 0 rgba(255,255,255,.03); }
    .title { font-weight: 900; margin-bottom: 8px; }
    .muted { color: rgba(232,236,246,.62); font-size: 12px; line-height: 1.6; }
    .signal { border-left: 3px solid; padding: 9px; background: #151923; border-radius: 8px; margin: 8px 0; }
    .buy { border-left-color: #19e6a6; }
    .sell { border-left-color: #7fb7ff; }
    .signal-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 900; }
    .signal p { margin-top: 6px; color: rgba(232,236,246,.68); font-size: 12px; line-height: 1.5; }
    .pill { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 950; }
    .pill.buy { color: #19e6a6; background: rgba(25,230,166,.1); border: 1px solid rgba(25,230,166,.18); }
    .pill.sell { color: #7fb7ff; background: rgba(127,183,255,.1); border: 1px solid rgba(127,183,255,.18); }
    .loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #05070c; border: 1px solid #363c4e; border-radius: 10px; padding: 16px 20px; display: none; z-index: 10; }
    .warn { color: #ffbf69; margin-top: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="brand">Chanlan <span>缠论</span></div>
    <div class="group">
      <label for="symbol">品种</label>
      <select id="symbol" aria-label="品种">
        <option>BTCUSDT</option>
        <option>ETHUSDT</option>
      </select>
    </div>
    <div class="group">
      <label for="interval">周期</label>
      <select id="interval" aria-label="周期">
        <option value="1" selected>1分钟（日）</option>
        <option value="15">15分钟（周）</option>
        <option value="30">30分钟（月）</option>
      </select>
    </div>
    <div class="group">
      <label><input type="checkbox" id="showBis" checked /> 本级笔</label>
      <label><input type="checkbox" id="showActiveBi" checked /> 未完成笔</label>
      <label><input type="checkbox" id="showSegments" checked /> 线段</label>
      <label><input type="checkbox" id="showFractals" /> 分型</label>
      <label><input type="checkbox" id="showSignals" checked /> 买卖点</label>
      <label><input type="checkbox" id="showBisLv2" /> 中级别笔</label>
      <label><input type="checkbox" id="showZhongshu" checked /> 中枢</label>
      <label><input type="checkbox" id="showZhongshuLv2" /> 中级别中枢</label>
    </div>
    <button id="analyzeBtn" class="primary">分析</button>
    <div class="spacer"></div>
    <div class="status">严格结构：<b>无证据不出点</b></div>
  </div>

  <div class="main">
    <div id="chart"></div>
    <aside class="sidebar">
      <div class="card">
        <div class="title">说明</div>
        <div class="muted">按“分型 → 笔 → 线段 → 中枢 → 背驰 → 买卖点”的顺序分析。结构不足、没有离开段背驰证据时，不输出买卖点。</div>
        <div id="warning" class="warn"></div>
      </div>
      <div class="card">
        <div class="title">结构状态</div>
        <div id="structureStatus" class="muted">点击分析</div>
      </div>
      <div class="card">
        <div class="title">当下关注点（可操作语境）</div>
        <div id="actionFocus" class="muted">点击分析</div>
      </div>
      <div class="card">
        <div class="title">买卖点信号</div>
        <div id="signalList" class="muted">点击分析</div>
      </div>
    </aside>
  </div>
  <div id="loading" class="loading">分析中...</div>

  <script>
    const chart = echarts.init(document.getElementById("chart"));
    let lastResult = null;

    async function analyze() {
      document.getElementById("loading").style.display = "block";
      try {
        const payload = {
          market: "crypto",
          symbol: document.getElementById("symbol").value,
          interval: document.getElementById("interval").value,
          limit: 1000
        };
        const res = await fetch("/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (!result.success) throw new Error(result.error?.message || "分析失败");
        lastResult = result;
        render(result);
      } catch (err) {
        showChartError(err.message || "分析失败");
        document.getElementById("structureStatus").innerHTML = `<span class="warn">${err.message}</span>`;
        document.getElementById("actionFocus").innerHTML = `<span class="warn">分析失败，无法生成当下语境</span>`;
        document.getElementById("signalList").innerHTML = `<span class="warn">暂无信号</span>`;
      } finally {
        document.getElementById("loading").style.display = "none";
      }
    }

    function showChartError(message) {
      chart.setOption({
        backgroundColor: "#131722",
        graphic: {
          type: "text",
          left: "center",
          top: "middle",
          style: {
            text: `行情加载失败\n${message}\n请稍后重试，或切换周期/品种。`,
            fill: "#d1d4dc",
            fontSize: 16,
            lineHeight: 28,
            textAlign: "center"
          }
        }
      }, true);
    }

    function render(result) {
      const times = result.kline_data.map(k => k.time);
      const candles = result.kline_data.map(k => [k.open, k.close, k.low, k.high]);
      const macdBars = result.macd_data.map(m => m.hist);
      const dif = result.macd_data.map(m => m.dif);
      const dea = result.macd_data.map(m => m.dea);
      const series = [
        {
          name: "K线",
          type: "candlestick",
          data: candles,
          xAxisIndex: 0,
          yAxisIndex: 0,
          itemStyle: { color: "#26a69a", color0: "#ef5350", borderColor: "#26a69a", borderColor0: "#ef5350" },
          markLine: {
            symbol: "none",
            data: [{ yAxis: result.current_price, label: { formatter: result.current_price.toFixed(2) } }],
            lineStyle: { color: "#f1d28a", type: "dashed" }
          }
        }
      ];

      if (document.getElementById("showBis").checked) series.push(strokeSeries("本级笔", result.bis, times.length, "#f1d28a", 2));
      if (document.getElementById("showActiveBi").checked && result.active_bi) series.push(activeStrokeSeries("未完成笔", result.active_bi, times.length));
      if (document.getElementById("showSegments").checked) series.push(strokeSeries("线段", result.segments, times.length, "#ffb74d", 3));
      if (document.getElementById("showFractals").checked) series.push(...fractalSeries(result.fractals));
      if (document.getElementById("showSignals").checked) {
        series.push(signalSeries("买点", result.buy_signals, "#19e6a6", "triangle"));
        series.push(signalSeries("卖点", result.sell_signals, "#7fb7ff", "pin"));
      }
      if (document.getElementById("showBisLv2").checked) series.push(strokeSeries("中级别笔", result.bis_lv2, times.length, "#4f7dff", 2));
      if (document.getElementById("showZhongshu").checked) series.push(pivotSeries("中枢", result.zhongshus, "#b45cff"));
      if (document.getElementById("showZhongshuLv2").checked) series.push(pivotSeries("中级别中枢", result.zhongshus_lv2, "#ff7ab6"));
      series.push({
        name: "MACD",
        type: "bar",
        xAxisIndex: 1,
        yAxisIndex: 1,
        data: macdBars,
        itemStyle: { color: value => value.data >= 0 ? "rgba(38,166,154,.72)" : "rgba(239,83,80,.72)" }
      });
      series.push({ name: "DIF", type: "line", xAxisIndex: 1, yAxisIndex: 1, data: dif, symbol: "none", lineStyle: { color: "#b39ddb", width: 1 } });
      series.push({ name: "DEA", type: "line", xAxisIndex: 1, yAxisIndex: 1, data: dea, symbol: "none", lineStyle: { color: "#ff8a80", width: 1 } });

      chart.setOption({
        backgroundColor: "#131722",
        animation: false,
        tooltip: { trigger: "axis" },
        legend: { top: 8, textStyle: { color: "#d1d4dc" } },
        axisPointer: { link: [{ xAxisIndex: [0, 1] }] },
        grid: [
          { left: 50, right: 70, top: 48, height: "70%" },
          { left: 50, right: 70, top: "82%", height: "12%" }
        ],
        dataZoom: [
          { type: "inside", xAxisIndex: [0, 1], start: 64, end: 100, filterMode: "none" },
          { type: "slider", xAxisIndex: [0, 1], start: 64, end: 100, bottom: 8, height: 18, filterMode: "none" }
        ],
        xAxis: [
          { type: "category", data: times, axisLine: { lineStyle: { color: "#363c4e" } }, axisLabel: { color: "rgba(209,212,220,.55)" } },
          { type: "category", data: times, gridIndex: 1, axisLine: { lineStyle: { color: "#363c4e" } }, axisLabel: { color: "rgba(209,212,220,.45)" } }
        ],
        yAxis: [
          { scale: true, position: "right", splitLine: { lineStyle: { color: "#262b38" } }, axisLabel: { color: "rgba(209,212,220,.7)" } },
          { scale: true, position: "right", gridIndex: 1, splitLine: { lineStyle: { color: "#262b38" } }, axisLabel: { color: "rgba(209,212,220,.48)" } }
        ],
        series
      }, true);
      updateVisiblePriceScale();

      document.getElementById("warning").textContent = result.warning || "";
      document.querySelector(".card .muted").textContent =
        `数据来自 ${result.data_source}；规则版本 ${result.rules_version}。当前展示笔中枢与线段中枢，并要求买卖点带背驰依据。`;
      renderStructureStatus(result);
      renderActionFocus(result);
      renderSignals(result);
    }

    function strokeSeries(name, strokes, len, color, width) {
      const data = Array(len).fill(null);
      for (const stroke of strokes) {
        data[stroke.start_idx] = stroke.start_price;
        data[stroke.end_idx] = stroke.end_price;
      }
      return { name, type: "line", xAxisIndex: 0, yAxisIndex: 0, data, connectNulls: true, symbol: "circle", symbolSize: 6, lineStyle: { color, width }, itemStyle: { color } };
    }

    function activeStrokeSeries(name, stroke, len) {
      const data = Array(len).fill(null);
      data[stroke.start_idx] = stroke.start_price;
      data[stroke.end_idx] = stroke.end_price;
      return {
        name,
        type: "line",
        xAxisIndex: 0,
        yAxisIndex: 0,
        data,
        connectNulls: true,
        symbol: "circle",
        symbolSize: 6,
        lineStyle: { color: "#f1d28a", width: 2, type: "dashed" },
        itemStyle: { color: "#f1d28a" }
      };
    }

    function fractalSeries(fractals) {
      const tops = fractals.filter(f => f.type === "TOP").map(f => [f.idx, f.price]);
      const bottoms = fractals.filter(f => f.type === "BOTTOM").map(f => [f.idx, f.price]);
      return [
        {
          name: "顶分型",
          type: "scatter",
          xAxisIndex: 0,
          yAxisIndex: 0,
          symbol: "triangle",
          symbolSize: 9,
          symbolRotate: 180,
          itemStyle: { color: "#7fb7ff" },
          data: tops
        },
        {
          name: "底分型",
          type: "scatter",
          xAxisIndex: 0,
          yAxisIndex: 0,
          symbol: "triangle",
          symbolSize: 9,
          itemStyle: { color: "#19e6a6" },
          data: bottoms
        }
      ];
    }

    function pivotSeries(name, pivots, color) {
      return {
        name,
        type: "line",
        xAxisIndex: 0,
        yAxisIndex: 0,
        data: [],
        markArea: {
          silent: true,
          itemStyle: { color, opacity: 0.16 },
          data: pivots.map(p => [{ xAxis: p.start_idx, yAxis: p.zd }, { xAxis: p.end_idx, yAxis: p.zg }])
        }
      };
    }

    function signalSeries(name, signals, color, symbol) {
      return {
        name,
        type: "scatter",
        xAxisIndex: 0,
        yAxisIndex: 0,
        symbol,
        symbolSize: 16,
        itemStyle: { color },
        data: signals.map(s => [s.idx, s.price])
      };
    }

    function updateVisiblePriceScale() {
      if (!lastResult || !lastResult.kline_data.length) return;
      const range = currentVisibleRange(lastResult.kline_data.length);
      const visibleCandles = lastResult.kline_data.slice(range.startIdx, range.endIdx + 1);
      if (!visibleCandles.length) return;

      const minLow = Math.min(...visibleCandles.map(k => k.low));
      const maxHigh = Math.max(...visibleCandles.map(k => k.high));
      const padding = Math.max((maxHigh - minLow) * 0.08, maxHigh * 0.001);
      chart.setOption({
        yAxis: [
          {
            min: minLow - padding,
            max: maxHigh + padding
          },
          {}
        ]
      });
    }

    function currentVisibleRange(length) {
      const dataZoom = chart.getOption().dataZoom?.[0] || {};
      const start = Number(dataZoom.start ?? 64);
      const end = Number(dataZoom.end ?? 100);
      return {
        startIdx: Math.max(0, Math.floor((start / 100) * (length - 1))),
        endIdx: Math.min(length - 1, Math.ceil((end / 100) * (length - 1)))
      };
    }

    function renderStructureStatus(result) {
      const el = document.getElementById("structureStatus");
      const lastBi = result.bis[result.bis.length - 1];
      const active = result.active_bi;
      const biPivots = result.zhongshus.filter(pivot => pivot.level === "bi").length;
      const segmentPivots = result.zhongshus.filter(pivot => pivot.level === "segment").length;
      const directionLabel = dir => dir === "UP" ? "上升" : "下降";
      el.innerHTML = `
        <div>确认笔数量：<b>${result.bis.length}</b></div>
        <div>本级分型数量：<b>${result.fractals.length}</b></div>
        <div>线段数量：<b>${result.segments.length}</b></div>
        <div>笔中枢数量：<b>${biPivots}</b></div>
        <div>线段中枢数量：<b>${segmentPivots}</b></div>
        <div>背驰候选：<b>${result.divergences.length}</b></div>
        ${lastBi ? `<div style="margin-top:8px;">最后确认笔：${directionLabel(lastBi.direction)}，${Number(lastBi.start_price).toFixed(2)} → ${Number(lastBi.end_price).toFixed(2)}</div>` : ""}
        ${active ? `<div style="margin-top:8px;color:#f1d28a;">当前未完成笔：${directionLabel(active.direction)}，${Number(active.start_price).toFixed(2)} → ${Number(active.end_price).toFixed(2)}</div>` : `<div style="margin-top:8px;">暂无未完成笔。</div>`}
        <div style="margin-top:8px;color:rgba(232,236,246,.56);">没有同级别中枢、离开段和背驰依据时，系统不会强行输出买卖点。</div>
      `;
    }

    function renderSignals(result) {
      const signals = [...result.buy_signals, ...result.sell_signals].sort((a, b) => b.idx - a.idx);
      const el = document.getElementById("signalList");
      if (!signals.length) {
        el.innerHTML = `<div class="muted">当前结构不足，暂无有效买卖点。需要先形成同级别中枢，并出现带背驰依据的离开段。</div>`;
        return;
      }
      const kindName = { first: "一类", second: "二类", third: "三类", td9: "TD9" };
      el.innerHTML = `<div class="muted" style="margin-bottom:10px;">以下为已发生的结构快照，用于对照图表；日内操作请以上方「当下关注点」为准。</div>`;
      el.innerHTML += signals.map(signal => `
        <div class="signal ${signal.side === "BUY" ? "buy" : "sell"}">
          <div class="signal-head">
            <span><span class="pill ${signal.side === "BUY" ? "buy" : "sell"}">${signal.side === "BUY" ? "BUY" : "SELL"}</span> ${kindName[signal.kind] || signal.kind}${signal.side === "BUY" ? "买点" : "卖点"}</span>
            <span>${Number(signal.price).toFixed(2)}</span>
          </div>
          <p>${signal.time}｜${signal.description}</p>
          ${signal.evidence ? `<p>依据：${signal.evidence}</p>` : ""}
        </div>
      `).join("");
    }

    function renderActionFocus(result) {
      const el = document.getElementById("actionFocus");
      if (!result.kline_data.length) {
        el.innerHTML = `<div class="muted">暂无 K 线数据</div>`;
        return;
      }
      if (result.action_focus) {
        el.innerHTML = actionFocusHtmlFromApi(result.action_focus, result.active_bi);
        return;
      }
      const lastIdx = result.kline_data.length - 1;
      const px = result.current_price;
      const dirLabel = d => d === "UP" ? "向上" : "向下";

      const recentBars = Math.max(18, Math.min(80, Math.floor(result.kline_data.length * 0.06)));
      const recentSince = lastIdx - recentBars;

      const lastPivot = nearestPivotContainingLastBar(result.zhongshus, lastIdx);
      let posText = "当前价格附近未落到已识别中枢区间内（或中枢列表为空）。";
      if (lastPivot) {
        const { zd, zg } = lastPivot;
        if (px >= zd && px <= zg) {
          posText = `价格 <b>${px.toFixed(2)}</b> 落在最近可视中枢 <b>[${zd.toFixed(2)}, ${zg.toFixed(2)}]</b> 内，属于中枢震荡语境。`;
        } else if (px > zg) {
          posText = `价格 <b>${px.toFixed(2)}</b> 在最近可视中枢 <b>[${zd.toFixed(2)}, ${zg.toFixed(2)}]</b> 上方，属于偏强离开/回踩观察语境。`;
        } else {
          posText = `价格 <b>${px.toFixed(2)}</b> 在最近可视中枢 <b>[${zd.toFixed(2)}, ${zg.toFixed(2)}]</b> 下方，属于偏弱离开/反抽观察语境。`;
        }
      }

      let activeLine = `<div>未完成笔：暂无（等待新笔启动或结构太短）</div>`;
      if (result.active_bi) {
        const ab = result.active_bi;
        activeLine = `<div>未完成笔：<b>${dirLabel(ab.direction)}</b>，${Number(ab.start_price).toFixed(2)} → ${Number(ab.end_price).toFixed(2)}（仅表示当下这一段<strong>尚未被反向分型确认</strong>）</div>`;
      }

      const lastDiv = latestDivergenceNearEnd(result.divergences, recentSince);
      let divLine = `<div style="margin-top:8px;">最近窗口背驰：最近 ${recentBars} 根内<strong>未发现</strong>可对照的背驰候选。</div>`;
      if (lastDiv) {
        const lvl = lastDiv.level === "bi" ? "笔" : "线段";
        divLine = `<div style="margin-top:8px;">最近窗口背驰：<b>${lvl}</b>方向 <b>${lastDiv.direction === "DOWN" ? "底背驰语境" : "顶背驰语境"}</b>，MACD 比 <b>${Number(lastDiv.ratio).toFixed(2)}</b>（仅说明力度对比，不代表此刻应下单）</div>`;
      }

      const recentSignal = latestSignalNearEnd([...result.buy_signals, ...result.sell_signals], recentSince);
      let hintLine = `<div style="margin-top:8px;color:rgba(232,236,246,.62);">当前没有“指令式”买卖点：本系统只做结构披露。若你要参与，至少需要你自己承受波动，并独立完成止损规则。</div>`;
      if (recentSignal) {
        const sideCn = recentSignal.side === "BUY" ? "买" : "卖";
        const kindName = { first: "一类", second: "二类", third: "三类", td9: "TD9" };
        hintLine = `<div style="margin-top:8px;color:#ffbf69;"><b>提醒</b>：最近窗口内出现过<b>${kindName[recentSignal.kind] || recentSignal.kind}${sideCn}</b>候选（${recentSignal.time}）。它只是结构回放，<b>不等于</b>此刻应进场；此刻仍以未完成笔与中枢位置为主。</div>`;
      }

      el.innerHTML = `
        <div>最新价：<b>${px.toFixed(2)}</b>（最后一根 K 线索引 ${lastIdx}）</div>
        ${activeLine}
        <div style="margin-top:8px;">${posText}</div>
        ${divLine}
        ${hintLine}
        <div style="margin-top:10px;color:rgba(232,236,246,.56);">说明：缠论里没有脱离级别的“现在就买/卖”。你要自己做交易，需要先选定主操作级别，再用更大级别定方向，本页只提供当前级别的结构与证据。</div>
      `;
    }

    function actionFocusHtmlFromApi(actionFocus, activeBiFallback) {
      const px = Number(actionFocus.current_price ?? 0);
      const lastIdx = Number(actionFocus.last_bar_index ?? 0);
      const recentBars = Number(actionFocus.recent_window_bars ?? 18);
      const dirLabel = d => d === "UP" ? "向上" : "向下";

      const slotLine = (label, slot) => {
        if (!slot || slot.relation === "none" || !slot.pivot) return `<div style="margin-top:8px;">${label}：当前无可用中枢参考。</div>`;
        const { zd, zg } = slot.pivot;
        if (slot.relation === "inside") {
          return `<div style="margin-top:8px;">${label}：价格 <b>${px.toFixed(2)}</b> 落在中枢 <b>[${Number(zd).toFixed(2)}, ${Number(zg).toFixed(2)}]</b> 内，属于中枢震荡语境。</div>`;
        }
        if (slot.relation === "above") {
          return `<div style="margin-top:8px;">${label}：价格 <b>${px.toFixed(2)}</b> 在中枢 <b>[${Number(zd).toFixed(2)}, ${Number(zg).toFixed(2)}]</b> 上方，属于偏强离开/回踩观察语境。</div>`;
        }
        return `<div style="margin-top:8px;">${label}：价格 <b>${px.toFixed(2)}</b> 在中枢 <b>[${Number(zd).toFixed(2)}, ${Number(zg).toFixed(2)}]</b> 下方，属于偏弱离开/反抽观察语境。</div>`;
      };

      const active = actionFocus.active_bi || activeBiFallback;
      let activeLine = `<div>未完成笔：暂无（等待新笔启动或结构太短）</div>`;
      if (active) {
        activeLine = `<div>未完成笔：<b>${dirLabel(active.direction)}</b>，${Number(active.start_price).toFixed(2)} → ${Number(active.end_price).toFixed(2)}（仅表示当下这一段<strong>尚未被反向分型确认</strong>）</div>`;
      }

      let divLine = `<div style="margin-top:8px;">最近窗口背驰：最近 ${recentBars} 根内<strong>未发现</strong>可对照的背驰候选。</div>`;
      if (actionFocus.recent_divergence) {
        const d = actionFocus.recent_divergence;
        const lvl = d.level === "bi" ? "笔" : "线段";
        divLine = `<div style="margin-top:8px;">最近窗口背驰：<b>${lvl}</b>方向 <b>${d.direction === "DOWN" ? "底背驰语境" : "顶背驰语境"}</b>，MACD 比 <b>${Number(d.ratio).toFixed(2)}</b>（仅说明力度对比，不代表此刻应下单）</div>`;
      }

      let hintLine = `<div style="margin-top:8px;color:rgba(232,236,246,.62);">当前没有“指令式”买卖点：本系统只做结构披露。若你要参与，至少需要你自己承受波动，并独立完成止损规则。</div>`;
      if (actionFocus.recent_signal) {
        const s = actionFocus.recent_signal;
        const sideCn = s.side === "BUY" ? "买" : "卖";
        const kindName = { first: "一类", second: "二类", third: "三类", td9: "TD9" };
        hintLine = `<div style="margin-top:8px;color:#ffbf69;"><b>提醒</b>：最近窗口内出现过<b>${kindName[s.kind] || s.kind}${sideCn}</b>候选（${s.time}）。它只是结构回放，<b>不等于</b>此刻应进场；此刻仍以未完成笔与中枢位置为主。</div>`;
      }

      return `
        <div>最新价：<b>${px.toFixed(2)}</b>（最后一根 K 线索引 ${lastIdx}）</div>
        ${activeLine}
        ${slotLine("本级中枢", actionFocus.primary_pivot)}
        ${slotLine("中级别中枢", actionFocus.higher_pivot)}
        ${divLine}
        ${hintLine}
        <div style="margin-top:10px;color:rgba(232,236,246,.56);">说明：缠论里没有脱离级别的“现在就买/卖”。你要自己做交易，需要先选定主操作级别，再用更大级别定方向，本页只提供当前级别的结构与证据。</div>
      `;
    }

    function nearestPivotContainingLastBar(pivots, lastIdx) {
      if (!pivots.length) return null;
      const candidates = pivots.filter(p => lastIdx >= p.start_idx && lastIdx <= p.end_idx);
      if (!candidates.length) {
        return pivots.reduce((best, p) => (p.end_idx > best.end_idx ? p : best), pivots[0]);
      }
      return candidates.reduce((best, p) => (p.end_idx - p.start_idx > best.end_idx - best.start_idx ? p : best), candidates[0]);
    }

    function latestDivergenceNearEnd(divergences, sinceIdx) {
      const windowed = divergences.filter(d => d.idx >= sinceIdx);
      if (!windowed.length) return null;
      return windowed.reduce((a, b) => (a.idx > b.idx ? a : b));
    }

    function latestSignalNearEnd(signals, sinceIdx) {
      const windowed = signals.filter(s => s.idx >= sinceIdx);
      if (!windowed.length) return null;
      return windowed.reduce((a, b) => (a.idx > b.idx ? a : b));
    }

    document.getElementById("analyzeBtn").addEventListener("click", analyze);
    document.getElementById("symbol").addEventListener("change", analyze);
    document.getElementById("interval").addEventListener("change", analyze);
    chart.on("dataZoom", updateVisiblePriceScale);
    ["showBis", "showActiveBi", "showSegments", "showFractals", "showSignals", "showBisLv2", "showZhongshu", "showZhongshuLv2"].forEach(id => {
      document.getElementById(id).addEventListener("change", () => { if (lastResult) render(lastResult); });
    });
    window.addEventListener("resize", () => chart.resize());

    analyze();
  </script>
</body>
</html>
